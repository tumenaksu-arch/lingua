name: EAS Build

# Manual trigger: builds the app in Expo's cloud (no local Android Studio / Xcode).
# Requires the EXPO_TOKEN repository secret (see docs/RELEASE.md).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: eas.json build profile
        type: choice
        default: development
        options: [development, preview, production]
      platform:
        type: choice
        default: android
        options: [android, ios, all]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Create a token at https://expo.dev/accounts/[account]/settings/access-tokens and add it under Settings > Secrets > Actions."
            exit 1
          fi
      - name: EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --non-interactive --no-wait --profile ${{ inputs.profile }} --platform ${{ inputs.platform }}
